# FlameCheck (flamecheck.bid): game deals. Static files only - no Worker code, no database, so it uses nothing from the free
# request limit that framecheck.uk needs. Deploy with: npm run deploy:flamecheck
name = "flamecheck"
compatibility_date = "2026-11-23"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "flamecheck.bid", custom_domain = true },
]

[assets]
directory = "./public"
not_found_handling = "single-page-application"
